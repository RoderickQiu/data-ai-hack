display_information:
  name: Job Agent
  description: Finds roles, explains why, and asks you less every day.
  background_color: "#1d1c1d"
features:
  bot_user:
    display_name: Job Agent
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.public
      - channels:history
      - groups:history
      - app_mentions:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
